services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: runtime
    image: insightforge-api:local
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
