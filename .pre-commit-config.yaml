# Install:  uv run --directory backend pre-commit install
# Run all:  uv run --directory backend pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv
        language: system
        args: [run, --directory, backend, mypy, src]
        files: ^backend/src/
        pass_filenames: false

      - id: pytest
        name: pytest (unit)
        entry: uv
        language: system
        args: [run, --directory, backend, pytest, tests/unit, -q]
        files: ^backend/
        pass_filenames: false
